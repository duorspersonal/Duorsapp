<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duo RS Assessoria Esportiva</title>
<style>
:root{--bg:#F4F1F6;--surf:#FFFFFF;--ink:#221A28;--mut:#6B6272;--line:#DDD5E2;--acc:#7A2E86;--acc2:#138A90;--onacc:#FFFFFF;--warn:#B76E00;--ok:#1E7A4F;--warnbg:#FFF1D6;--okbg:#DDF3E6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161219;--surf:#211B27;--ink:#EEE8F2;--mut:#A89DB0;--line:#3A3142;--acc:#D08BDC;--acc2:#4FC1C6;--onacc:#2A0F30;--warn:#F2B55A;--ok:#6FD6A0;--warnbg:#3A2C10;--okbg:#14332A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161219;--surf:#211B27;--ink:#EEE8F2;--mut:#A89DB0;--line:#3A3142;--acc:#D08BDC;--acc2:#4FC1C6;--onacc:#2A0F30;--warn:#F2B55A;--ok:#6FD6A0;--warnbg:#3A2C10;--okbg:#14332A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:18px 18px 8px}
header h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:800}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 18px 18px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surf)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.big{font-size:17px;font-weight:700}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:8px}
.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g input{margin-top:0}
button.p{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;cursor:pointer}
button.l{border:0;background:none;color:var(--acc);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
button.d{border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;padding:0 6px}
.tag{padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;border:0;cursor:pointer}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.no{background:var(--warnbg);color:var(--warn)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum .card{margin:0}.sum b{display:block;font-size:22px;letter-spacing:-.02em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;margin:6px 0;background:var(--surf);border:1px solid var(--line)}
.msg.p{margin-left:auto;background:var(--acc);color:var(--onacc);border-color:var(--acc)}
h3{margin:16px 0 8px;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
.s3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.s3 .card{margin:0;padding:12px}.s3 b{display:block;font-size:28px;letter-spacing:-.02em}
.bars{display:flex;align-items:flex-end;gap:10px;height:84px;margin-top:10px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--mut)}.bar{width:100%;max-width:18px;border-radius:6px;background:var(--acc2)}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.hs .card{min-width:230px;max-width:230px;margin:0}
.lb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.lb .card{margin:0}
details.card summary{cursor:pointer;font-weight:700;color:var(--acc)}
.star{color:var(--warn);letter-spacing:2px}
nav button{font-size:11px;padding:12px 2px}
.fl{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.fc{min-width:104px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surf);cursor:pointer}.fc b{display:block;font-size:26px;letter-spacing:-.02em}.fc span{color:var(--mut);font-size:14px}.fc.on{background:var(--acc);border-color:var(--acc)}.fc.on b,.fc.on span{color:var(--onacc)}
.av{width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--acc);font-size:20px;flex:none}
.acts{display:flex;gap:6px;justify-content:space-between;margin-top:14px}.acts>*{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;font-size:12px;text-align:center;color:var(--ink);background:none;border:0;text-decoration:none;cursor:pointer;padding:0}.acts i{font-style:normal;width:46px;height:46px;border-radius:14px;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.er{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.er:last-child{border-bottom:0}
.cs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px 0}.cs>.card{min-width:88%;margin:0;scroll-snap-align:start;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sh{background:var(--bg);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto}.grab{width:48px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center}.cal small{color:var(--mut)}.cd{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--ink);font:inherit;cursor:pointer}.cd.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}.cd.td{outline:2px solid var(--acc2)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc2)}
.cd.sc{border-color:var(--acc);color:var(--acc)}.cd.ft{background:#F8DAD6;color:#B4372D;text-decoration:line-through}.cd.ex{background:var(--acc2);color:#fff;border-color:var(--acc2)}
html{-webkit-text-size-adjust:100%}button,a,[data-a]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}.gt{text-align:center;cursor:pointer}.gi{color:var(--acc);aspect-ratio:1/.85;display:grid;place-items:center;border-radius:16px;background:var(--surf);background:color-mix(in srgb,var(--acc) 10%,var(--surf));font-size:34px}.gn{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:calc(env(safe-area-inset-bottom,0px) + 58px);width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:32px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
.sech{display:flex;align-items:center;gap:12px;width:100%;padding:16px;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;cursor:pointer}.ei{width:28px;text-align:center;color:var(--mut);font-size:20px}.el{font-size:13px;color:var(--mut)}.er input,.er select{margin:0;border:0;background:none;padding:2px 0;font-size:16px;border-radius:0}.tile{border:0;border-radius:14px;padding:14px;color:#fff;text-align:left;font:inherit;cursor:pointer}.tile small{display:block;opacity:.85;letter-spacing:.06em}.tile b{font-size:18px}
.mi{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}.mi:last-child{border-bottom:0}
.hrow{display:flex;align-items:center;gap:12px}.logo{height:62px;width:auto;flex:none}
</style>

<meta name="apple-mobile-web-app-status-bar-style" content="default">
